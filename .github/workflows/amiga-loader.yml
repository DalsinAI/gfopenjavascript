name: javascript.library 68040 loader and JS
on:
  push:
    paths:
      - 'src/jslib/**'
      - 'scripts/build-javascript-library.sh'
      - 'toolchain/**'
      - '.github/workflows/amiga-loader.yml'
  pull_request:
    paths:
      - 'src/jslib/**'
      - 'scripts/build-javascript-library.sh'
      - 'toolchain/**'
      - '.github/workflows/amiga-loader.yml'
  workflow_dispatch:
env:
  OPENSDK_REF: 9433cc8d2b1b363b095f0af14e3c114f2aebb22a
  TC_URL: https://github.com/DalsinAI/gfopengcc/releases/download/v16.2.0-open6/gfopenamigagcc-16.2.0-open6-x86_64-linux.tar.xz
  TC_SHA256: 65f284476ec20cdf7851475d91d2c18d77fa6f2a0eb0f844b6ca23dbfa57eaa7
jobs:
  amiga:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: DalsinAI/gfopensdk
          ref: ${{ env.OPENSDK_REF }}
          path: gfopensdk
      - name: Fetch pinned cross compiler
        run: |
          mkdir -p tc
          curl -fsSL -o tc/tc.tar.xz "$TC_URL"
          echo "$TC_SHA256  tc/tc.tar.xz" | sha256sum -c -
          tar xf tc/tc.tar.xz -C tc
      - name: Build 68040 loader and JS shell
        run: |
          TOOLCHAIN_DIR=tc/gfopenamigagcc-16.2.0-open6-x86_64-linux \
          NDK_INCLUDE=$PWD/gfopensdk/OpenNDK/Include_H \
          OPENSDK_SRC=$PWD/gfopensdk \
          scripts/build-javascript-library.sh build/javascript-library
      - name: Compile AmigaOS engine dispatcher
        run: |
          D=tc/gfopenamigagcc-16.2.0-open6-x86_64-linux/bin
          for f in jsl_os_exec jsl_engine; do
            $D/m68k-amigaos-gcc -m68040 -O2 -Wall -Wextra -Werror -Wno-unused-parameter -fno-common \
              -Isrc/jslib -Isrc/jslib/sdk/Include_H -I$PWD/gfopensdk/OpenNDK/Include_H \
              -c src/jslib/$f.c -o build/javascript-library/$f.o
          done
      - name: Cross-compile native prototype regression probe
        run: |
          D=tc/gfopenamigagcc-16.2.0-open6-x86_64-linux/bin
          $D/m68k-amigaos-gcc -m68040 -specs=$PWD/toolchain/m68k-soft-m68040.specs -mcrt=nix20 \
            -Os -std=gnu99 -Wall -Wextra -Werror \
            -Isrc/jslib/sdk/Include_H -I$PWD/gfopensdk/OpenNDK/Include_H \
            tests/native/class_prototype_probe.c -o build/javascript-library/js-prototype-probe
      - name: Validate Amiga files and v2 version tag
        run: |
          D=tc/gfopenamigagcc-16.2.0-open6-x86_64-linux/bin
          L=build/javascript-library/javascript.library
          for f in "$L" build/javascript-library/JS; do
            "$D/m68k-amigaos-objdump" -f "$f" | grep -q 'file format amiga'
          done
          if grep -E 'lib(nix|c)[^ ]*\.a\(' build/javascript-library/javascript.library.map; then
            echo "Loader unexpectedly links C runtime"; exit 1
          fi
          strings "$L" | grep '^\$VER: javascript.library 2\.'
          python3 src/jslib/check_vectors.py
          sha256sum "$L" build/javascript-library/JS
      - uses: actions/upload-artifact@v4
        with:
          name: gfopenjavascript-v2-68040-loader-unqualified
          path: |
            build/javascript-library/javascript.library
            build/javascript-library/JS
            build/javascript-library/js-prototype-probe
            build/javascript-library/javascript.library.map
          retention-days: 30
